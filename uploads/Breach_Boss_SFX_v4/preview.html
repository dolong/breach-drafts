<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breach · Boss SFX v4</title><style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#dddcd6;--acc:#d2452f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111214;--card:#1b1c1f;--ink:#ececee;--mute:#9a9aa2;--line:#2c2d31;--acc:#ff6b4a}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:20px;max-width:980px;margin:auto}
h1{font-size:18px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:block}
button:hover{border-color:var(--acc)}button:active{transform:translateY(1px)}
b{display:block;color:var(--ink)}small{color:var(--mute)}.seq b{color:var(--acc)}
</style></head><body>
<h1>BREACH · BOSS SFX v4 · alarm, boss reveals, Garganta</h1>
<p>Open this from the unzipped folder. A and B are the two takes on the alarm and the Garganta reveal. Each tap plays the next file round-robin at its bus level (combat −6dB, big 0dB).</p>
<h2>Sequences</h2><div class="grid" id="seq"></div>
<h2>Clips</h2><div class="grid" id="clips"></div>
<script>
const by={"encounter_alarm": {"files": ["ogg/encounter_alarm_01.ogg"], "gain": 0, "ev": "Red alert before a boss reveal — ship klaxon, sub hit, riser cresting into the reveal"}, "encounter_alarm_loop": {"files": ["ogg/encounter_alarm_loop_01.ogg"], "gain": 0, "ev": "Klaxon loop (2 cycles, seamless) if the reveal ever waits on a tap"}, "boss_warp_in": {"files": ["ogg/boss_warp_in_01.ogg"], "gain": 0, "ev": "Boss materialises — reversed swell sucks in, cinematic slam + sub drop at 0.42s"}, "reveal_garganta": {"files": ["ogg/reveal_garganta_01.ogg"], "gain": 0, "ev": "Garganta reveal — breath in, dragon roar on the colour flash, bite + T-Rex roar on the name slam"}, "reveal_mothercore": {"files": ["ogg/reveal_mothercore_01.ogg"], "gain": 0, "ev": "Mother Core reveal — braam on the colour flash, metal slam + sub on the name slam"}, "reveal_marauder": {"files": ["ogg/reveal_marauder_01.ogg"], "gain": 0, "ev": "Marauder reveal — hit on the colour flash, warship roars past and peaks on the name slam"}, "boss_phase2_frenzy": {"files": ["ogg/boss_phase2_frenzy_01.ogg"], "gain": 0, "ev": "Garganta FRENZY — full dragon roar over a braam and sub hit"}, "garganta_inhale": {"files": ["ogg/garganta_inhale_01.ogg"], "gain": -6, "ev": "Garganta draws breath — maw open, ×2 damage window"}, "garganta_hurt": {"files": ["ogg/garganta_hurt_01.ogg", "ogg/garganta_hurt_02.ogg", "ogg/garganta_hurt_03.ogg", "ogg/garganta_hurt_04.ogg"], "gain": -6, "ev": "Garganta flinches — pained snarl, layered on boss_hit"}, "garganta_bite": {"files": ["ogg/garganta_bite_01.ogg", "ogg/garganta_bite_02.ogg", "ogg/garganta_bite_03.ogg"], "gain": 0, "ev": "BITE — growl wind-up, lunge, jaw SNAP at 0.385s, roar"}, "garganta_maw_shut": {"files": ["ogg/garganta_maw_shut_01.ogg", "ogg/garganta_maw_shut_02.ogg"], "gain": 0, "ev": "MAW SHUTS — heavy jaw clamp, thud, low growl"}, "encounter_alarm__B": {"files": ["alt_B/ogg/encounter_alarm_B_01.ogg"], "gain": 0, "ev": "Red alert — cinematic two-tone trailer alarm, boom, riser into the reveal"}, "reveal_garganta__B": {"files": ["alt_B/ogg/reveal_garganta_B_01.ogg"], "gain": 0, "ev": "Garganta reveal — beast growl on the colour flash, braam + dragon roar on the name slam"}};const last={};
function play(id,extraDb=0){const c=by[id];let i;do{i=Math.floor(Math.random()*c.files.length)}while(c.files.length>1&&i===last[id]);last[id]=i;
 const a=new Audio(c.files[i]);a.volume=Math.min(1,Math.pow(10,(c.gain+extraDb)/20));a.play().catch(()=>{});return c.files[i]}
const S=[["A · Alarm → Garganta reveal", [[0, "encounter_alarm"], [1100, "reveal_garganta"]]], ["B · Alarm → Garganta reveal", [[0, "encounter_alarm__B"], [1100, "reveal_garganta__B"]]], ["Alarm → Mother Core reveal", [[0, "encounter_alarm"], [1100, "reveal_mothercore"]]], ["Alarm → Marauder reveal", [[0, "encounter_alarm"], [1100, "reveal_marauder"]]], ["Boss warps in", [[0, "boss_warp_in"]]], ["Garganta: inhale → bite", [[0, "garganta_inhale"], [1500, "garganta_bite"]]], ["Garganta: hit ×3 (hurt)", [[0, "garganta_hurt"], [700, "garganta_hurt"], [1400, "garganta_hurt"]]], ["Garganta: maw shuts", [[0, "garganta_maw_shut"]]], ["Garganta: FRENZY", [[0, "boss_phase2_frenzy"]]], ["Klaxon loop ×3", [[0, "encounter_alarm_loop"], [841, "encounter_alarm_loop"], [1682, "encounter_alarm_loop"]]]];
const sq=document.getElementById("seq");for(const [n,ev] of S){const b=document.createElement("button");b.className="seq";b.innerHTML=`<b>${n}</b><small>${ev.length} events</small>`;b.onclick=()=>ev.forEach(([t,id])=>setTimeout(()=>play(id),t));sq.appendChild(b)}
const cl=document.getElementById("clips");for(const [id,c] of Object.entries(by)){const b=document.createElement("button");b.innerHTML=`<b>${id.replace("__B"," (B)")}</b><small>${c.ev} · ${c.files.length} file${c.files.length>1?"s":""}</small>`;b.onclick=()=>play(id);cl.appendChild(b)}
</script></body></html>
