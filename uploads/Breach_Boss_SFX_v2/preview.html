<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breach · Boss SFX preview</title>
<style>
:root{--bg:#05040f;--panel:#0a0821;--line:#2a2752;--text:#f2f2f2;--dim:#a9b0c0;--red:#ff4d4d;--gold:#ffd644}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:16px;max-width:980px;margin:auto}
h1{font-size:20px;letter-spacing:1px;margin:0 0 4px}p{color:var(--dim);margin:0 0 14px}
h2{font-size:13px;letter-spacing:1px;color:var(--gold);margin:22px 0 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
button{all:unset;cursor:pointer;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
button:hover{border-color:var(--text)}button:active{transform:translate(1px,1px)}button.on{border-color:var(--gold)}
b{font-weight:700;font-size:13px}small{color:var(--dim);font-size:11px}
.seq button{border-color:#5a1a2a}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
.t{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;background:#1c1a3a;color:var(--dim);margin-left:6px}
</style></head><body>
<h1>BREACH · BOSS SFX v2 · generated clips</h1>
<p>Only the 18 generated clips are here. The pack clips play from your own Pixel Combat folder. Tap to audition. Sequences replay the game’s own timings from the boss files. Variants rotate round-robin.</p>
<div class="bar"><label><input type="checkbox" id="tiers" checked> apply mix tiers (big 0 · combat −6 · ui −9 dB)</label><label>master <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label></div>
<h2>Sequences</h2><div class="grid seq" id="seq"></div>
<div id="groups"></div>
<script>
const M = {"clips": [{"id": "encounter_alarm", "source": "generated:encounter_alarm", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "SURPRISE ENCOUNTER — gate flips red, ship-wide klaxon", "trigger": "Jump Gate v2 · alarm() (replaces the three 660/440 square tone pairs)", "files": [{"name": "encounter_alarm", "ogg": "ogg/encounter_alarm.ogg", "mp3": "mp3/encounter_alarm.mp3", "duration_ms": 1250, "peak_db": -3.8}]}, {"id": "encounter_alarm_loop", "source": "generated:encounter_alarm_loop", "tier": "big", "gain_db": 0, "loop": true, "round_robin": false, "event": "Seamless klaxon loop, if the alarm ever needs to hold longer than 1.1s", "trigger": "Optional — loop while waiting (e.g. if reveal is ever gated on a tap)", "files": [{"name": "encounter_alarm_loop", "ogg": "ogg/encounter_alarm_loop.ogg", "mp3": "mp3/encounter_alarm_loop.mp3", "duration_ms": 560, "peak_db": -5.7}]}, {"id": "reveal_marauder", "source": "generated:reveal_marauder", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Marauder reveal stinger — corsair power-chord, name slam at 0.96s", "trigger": "Jump Gate v2 · reveal() when boss = marauder (replaces both reveal tones)", "files": [{"name": "reveal_marauder", "ogg": "ogg/reveal_marauder.ogg", "mp3": "mp3/reveal_marauder.mp3", "duration_ms": 1964, "peak_db": -2.5}]}, {"id": "reveal_mothercore", "source": "generated:reveal_mothercore", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Mother Core reveal stinger — FM foundry hit, scanning arpeggio, metal slam at 0.96s", "trigger": "Jump Gate v2 · reveal() when boss = mothercore (replaces both reveal tones)", "files": [{"name": "reveal_mothercore", "ogg": "ogg/reveal_mothercore.ogg", "mp3": "mp3/reveal_mothercore.mp3", "duration_ms": 2199, "peak_db": -2.0}]}, {"id": "reveal_garganta", "source": "generated:reveal_garganta", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Garganta reveal stinger — low growl and sub drop, jaw snap at 0.96s", "trigger": "Jump Gate v2 · reveal() when boss = garganta (replaces both reveal tones)", "files": [{"name": "reveal_garganta", "ogg": "ogg/reveal_garganta.ogg", "mp3": "mp3/reveal_garganta.mp3", "duration_ms": 2166, "peak_db": -1.0}]}, {"id": "boss_warp_in", "source": "generated:boss_warp_in", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Boss materialises — reverse swell into impact at 0.42s", "trigger": "boss files · warpIn() (flash lands at +420ms)", "files": [{"name": "boss_warp_in", "ogg": "ogg/boss_warp_in.ogg", "mp3": "mp3/boss_warp_in.mp3", "duration_ms": 1300, "peak_db": -1.0}]}, {"id": "boss_intent", "source": "generated:boss_intent", "tier": "ui", "gain_db": -9, "loop": false, "round_robin": false, "event": "New boss intent shown (FIRES n / BITES n)", "trigger": "boss files · startRound() when the NEXT tag changes", "files": [{"name": "boss_intent", "ogg": "ogg/boss_intent.ogg", "mp3": "mp3/boss_intent.mp3", "duration_ms": 165, "peak_db": -2.4}]}, {"id": "boss_intent_danger", "source": "generated:boss_intent_danger", "tier": "combat", "gain_db": -6, "loop": false, "round_robin": false, "event": "Big intent shown — CORE BEAM / DEVOUR / FIRES 4+", "trigger": "boss files · startRound() when the intent is the max or ≥4", "files": [{"name": "boss_intent_danger", "ogg": "ogg/boss_intent_danger.ogg", "mp3": "mp3/boss_intent_danger.mp3", "duration_ms": 793, "peak_db": -4.9}]}, {"id": "boss_death", "source": "generated:boss_death", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Boss destruction — 10 chain bursts, big blast at 1.46s, three after-bursts; timed to explode()", "trigger": "boss files · explode() — play once at the start; win() fires at 2.6s", "files": [{"name": "boss_death", "ogg": "ogg/boss_death.ogg", "mp3": "mp3/boss_death.mp3", "duration_ms": 2750, "peak_db": -3.8}]}, {"id": "boss_victory", "source": "generated:boss_victory", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Boss defeated — chiptune fanfare", "trigger": "boss files · win()", "files": [{"name": "boss_victory", "ogg": "ogg/boss_victory.ogg", "mp3": "mp3/boss_victory.mp3", "duration_ms": 2336, "peak_db": -3.8}]}, {"id": "fleet_defeat", "source": "generated:fleet_defeat", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Hull gone — hull bursts, final blow at 0.62s, power-down phrase", "trigger": "boss files · lose() — play once at the start", "files": [{"name": "fleet_defeat", "ogg": "ogg/fleet_defeat.ogg", "mp3": "mp3/fleet_defeat.mp3", "duration_ms": 2200, "peak_db": -1.8}]}, {"id": "boss_phase2_frenzy", "source": "generated:boss_phase2_frenzy", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Garganta FRENZY at half HP — rising roar with three surges", "trigger": "Garganta · afterPlayer() when FRENZY pops (flicker is 3×300ms)", "files": [{"name": "boss_phase2_frenzy", "ogg": "ogg/boss_phase2_frenzy.ogg", "mp3": "mp3/boss_phase2_frenzy.mp3", "duration_ms": 1850, "peak_db": -1.2}]}, {"id": "mothercore_core_open", "source": "generated:mothercore_core_open", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Core opens — clunks, servo, bright 'exposed' chime", "trigger": "Mother Core · startRound() when exposed() becomes true (CORE EXPOSED · HITS ×2)", "files": [{"name": "mothercore_core_open", "ogg": "ogg/mothercore_core_open.ogg", "mp3": "mp3/mothercore_core_open.mp3", "duration_ms": 1341, "peak_db": -2.9}]}, {"id": "mothercore_core_seal", "source": "generated:mothercore_core_seal", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "CORE SEALS — servo down, clamp, charge hum builds (900ms glow)", "trigger": "Mother Core · enemyTurn() when atk = 0", "files": [{"name": "mothercore_core_seal", "ogg": "ogg/mothercore_core_seal.ogg", "mp3": "mp3/mothercore_core_seal.mp3", "duration_ms": 989, "peak_db": -1.0}]}, {"id": "garganta_inhale", "source": "generated:garganta_inhale", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "Garganta INHALES — maw exposed for ×2", "trigger": "Garganta · startRound() when exposed() becomes true", "files": [{"name": "garganta_inhale", "ogg": "ogg/garganta_inhale.ogg", "mp3": "mp3/garganta_inhale.mp3", "duration_ms": 1100, "peak_db": -5.2}]}, {"id": "garganta_maw_shut", "source": "generated:garganta_maw_shut", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "MAW SHUTS — heavy clamp, wet crunch, rumble", "trigger": "Garganta · enemyTurn() when atk = 0", "files": [{"name": "garganta_maw_shut", "ogg": "ogg/garganta_maw_shut.ogg", "mp3": "mp3/garganta_maw_shut.mp3", "duration_ms": 854, "peak_db": -1.0}]}, {"id": "garganta_bite", "source": "generated:garganta_bite", "tier": "big", "gain_db": 0, "loop": false, "round_robin": false, "event": "BITE — growl windup, lunge whoosh, jaw SNAP at 0.385s, rumble", "trigger": "Garganta · bite() at the start (impact lands at +385ms)", "files": [{"name": "garganta_bite", "ogg": "ogg/garganta_bite.ogg", "mp3": "mp3/garganta_bite.mp3", "duration_ms": 1271, "peak_db": -1.0}]}, {"id": "garganta_hurt", "source": "generated:garganta_hurt", "tier": "combat", "gain_db": -6, "loop": false, "round_robin": false, "event": "Garganta flinches — short pained screech (layer on boss_hit)", "trigger": "Garganta · hurt()", "files": [{"name": "garganta_hurt", "ogg": "ogg/garganta_hurt.ogg", "mp3": "mp3/garganta_hurt.mp3", "duration_ms": 450, "peak_db": -4.4}]}]};
const ext = new Audio().canPlayType('audio/ogg; codecs="vorbis"') ? 'ogg' : 'mp3';
const byId = {}; M.clips.forEach(c => byId[c.id] = c);
const rr = {};
function play(id){
  const c = byId[id]; if(!c) return;
  const i = rr[id] = ((rr[id] ?? -1) + 1) % c.files.length, f = c.files[i];
  const a = new Audio(f[ext]); const tier = document.getElementById('tiers').checked ? Math.pow(10, c.gain_db/20) : 1;
  a.volume = Math.min(1, tier * +document.getElementById('vol').value);
  if (c.loop) { a.loop = true; setTimeout(() => a.pause(), 2800); }
  a.play();
}
let timers = [];
function seq(steps){ timers.forEach(clearTimeout); timers = steps.map(([ms,id]) => setTimeout(() => play(id), ms)); }
const S = [
  ['Alarm → Marauder reveal', [[0,'encounter_alarm'],[1100,'reveal_marauder']]],
  ['Alarm → Mother Core reveal', [[0,'encounter_alarm'],[1100,'reveal_mothercore']]],
  ['Alarm → Garganta reveal', [[0,'encounter_alarm'],[1100,'reveal_garganta']]],
  ['Warp in → intent', [[0,'boss_warp_in'],[1500,'boss_intent'],[2300,'boss_intent_danger']]],
  ['Mother Core: core opens → seals', [[0,'mothercore_core_open'],[1600,'mothercore_core_seal']]],
  ['Garganta: inhale → shut → bite', [[0,'garganta_inhale'],[1400,'garganta_maw_shut'],[2600,'garganta_bite']]],
  ['Garganta: hurt → frenzy', [[0,'garganta_hurt'],[700,'boss_phase2_frenzy']]],
  ['Boss death → victory', [[0,'boss_death'],[2600,'boss_victory']]],
  ['Defeat', [[0,'fleet_defeat']]],
];
const sq = document.getElementById('seq');
S.forEach(([n,st]) => { const b = document.createElement('button'); b.innerHTML = '<b>▶ '+n+'</b><small>'+st.length+' cues · '+(Math.max(...st.map(s=>s[0]))/1000).toFixed(2)+'s</small>'; b.onclick = () => seq(st); sq.appendChild(b); });
const G = [['Encounter flow',/^(gate_|encounter_|reveal_|boss_engage)/],['Fight · shared',/^(boss_(warp|intent|hit|death|victory|phase)|fleet_|shield_|hull_|ship_)/],['Marauder',/^marauder_/],['Mother Core',/^mothercore_/],['Garganta',/^garganta_/]];
const root = document.getElementById('groups');
G.forEach(([title,re]) => { const h = document.createElement('h2'); h.textContent = title; root.appendChild(h); const g = document.createElement('div'); g.className = 'grid'; root.appendChild(g);
  M.clips.filter(c => re.test(c.id)).forEach(c => { const b = document.createElement('button'); const n = c.files.length;
    b.innerHTML = '<b>'+c.id+(n>1?'<span class="t">×'+n+'</span>':'')+(c.loop?'<span class="t">loop</span>':'')+'<span class="t">'+c.tier+'</span></b><small>'+c.event+'</small>';
    b.onclick = () => play(c.id); g.appendChild(b); }); });
</script></body></html>
